openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Read-only market proxy operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/coins:
    get:
      operationId: getMarketCoins
      tags: [market]
      summary: Get top market coins
      responses:
        "200":
          description: Top ten coins by market capitalization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketCoin"
  /market/global:
    get:
      operationId: getGlobalMarket
      tags: [market]
      summary: Get global market metrics
      responses:
        "200":
          description: Global market metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalMarketResponse"
  /market/coins/{id}/chart:
    get:
      operationId: getCoinChart
      tags: [market]
      summary: Get seven-day chart data for a coin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Seven-day market chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinChartResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketCoin:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        image: { type: string }
        current_price: { type: number }
        price_change_percentage_24h: { type: ["number", "null"] }
        market_cap: { type: number }
        total_volume: { type: number }
      required:
        - id
        - symbol
        - name
        - image
        - current_price
        - price_change_percentage_24h
        - market_cap
        - total_volume
    GlobalMarketResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            total_market_cap:
              type: object
              properties:
                usd: { type: number }
              required: [usd]
            total_volume:
              type: object
              properties:
                usd: { type: number }
              required: [usd]
            market_cap_percentage:
              type: object
              properties:
                btc: { type: number }
              required: [btc]
          required: [total_market_cap, total_volume, market_cap_percentage]
      required: [data]
    CoinChartResponse:
      type: object
      properties:
        prices:
          type: array
          items:
            type: array
            prefixItems:
              - type: number
              - type: number
            minItems: 2
            maxItems: 2
      required: [prices]

